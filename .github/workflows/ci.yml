name: ci

on:
  push:
    branches: [main]
    paths:
      - "policies/**"
      - "mask-policies/**"
      - "dq/**"
      - "env/**"
      - "tests/**"
      - "tools/**"
  pull_request:
    paths:
      - "policies/**"
      - "mask-policies/**"
      - "dq/**"
      - "env/**"
      - "tests/**"
      - "tools/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate configuration
        run: make validate
